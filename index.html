<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>棋乐园 · 小朋友的棋室</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%235a1d14'/><text x='32' y='46' font-size='40' text-anchor='middle' fill='%23e9c46a' font-family='serif'>棋</text></svg>" />
    <style>
      :root {
        color-scheme: dark;
        --ink: #f4ead8;
        --muted: #c4b297;
        --gold: #e9c46a;
        --gold-dim: rgba(233, 196, 106, 0.22);
        --line: rgba(233, 196, 106, 0.2);
        --red: #e8604a;
        --lacquer: linear-gradient(180deg, rgba(49, 28, 21, 0.93), rgba(26, 15, 11, 0.95));
        --kai: "STKaiti", "Kaiti SC", "KaiTi", "STSong", serif;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #1b1714; color: var(--ink); }
      body {
        display: grid;
        place-items: center;
        padding: 24px 16px 40px;
        background:
          radial-gradient(1100px 500px at 50% -10%, rgba(90, 29, 20, 0.55), transparent 70%),
          radial-gradient(900px 600px at 50% 110%, rgba(59, 49, 39, 0.4), transparent 70%),
          #1b1714;
      }
      main { width: min(880px, 100%); text-align: center; }

      header h1 {
        margin: 0 0 6px;
        font: 400 clamp(34px, 7vw, 52px)/1.15 var(--kai);
        color: var(--gold);
        letter-spacing: 0.22em;
        text-indent: 0.22em;
      }
      header p { margin: 0; color: var(--muted); font-size: 15px; }
      header .rule {
        width: min(320px, 60vw);
        height: 1px;
        margin: 16px auto 0;
        background: linear-gradient(90deg, transparent, var(--gold) 20%, var(--gold) 80%, transparent);
      }

      .games {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 18px;
        margin-top: 26px;
      }
      @media (max-width: 640px) { .games { grid-template-columns: 1fr; } }

      .game {
        display: block;
        text-decoration: none;
        color: var(--ink);
        background: var(--lacquer);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 26px 22px 22px;
        box-shadow: 0 20px 44px -14px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 236, 200, 0.07);
        transition: transform 0.35s var(--ease), border-color 0.35s var(--ease), box-shadow 0.35s var(--ease);
      }
      .game:hover, .game:active { transform: translateY(-4px); border-color: var(--gold); box-shadow: 0 26px 50px -14px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 236, 200, 0.07); }

      .seal {
        display: inline-grid;
        place-items: center;
        width: 64px;
        height: 64px;
        border-radius: 12px;
        font: 400 34px/1 var(--kai);
        color: var(--gold);
        border: 1.5px solid var(--line);
        background: var(--gold-dim);
      }
      .game.red .seal { color: var(--red); background: rgba(232, 96, 74, 0.14); border-color: rgba(232, 96, 74, 0.35); }
      .game h2 { margin: 14px 0 2px; font: 400 26px/1.2 var(--kai); letter-spacing: 0.14em; }
      .game h2 small { font-size: 14px; color: var(--muted); letter-spacing: 0.2em; margin-left: 8px; }
      .game p { margin: 8px 0 16px; color: var(--muted); font-size: 13.5px; line-height: 1.7; }
      .go {
        display: inline-block;
        min-width: 132px;
        padding: 10px 22px;
        border-radius: 10px;
        background: var(--gold);
        color: #2a1810;
        font: 400 18px/1 var(--kai);
        letter-spacing: 0.18em;
        text-indent: 0.18em;
      }
      .game.black .go { background: #c7d3df; }
      .game:hover .go { transform: scale(1.04); }
      .go { transition: transform 0.3s var(--ease); }

      footer { margin-top: 30px; color: var(--faint, #a69379); font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>棋 乐 园</h1>
        <p>桌上有两支会自己下棋的小军队，也欢迎你来当将军！</p>
        <div class="rule"></div>
      </header>

      <div class="games">
        <a class="game red" href="https://ahjdzx.github.io/shachang-dianbing/">
          <span class="seal">旗</span>
          <h2>沙场点兵<small>军棋</small></h2>
          <p>司令、炸弹、地雷，一支小军队在桌上自己打仗。你也可以点兵选阵，亲自指挥一场战斗！</p>
          <span class="go">开战！</span>
        </a>

        <a class="game black" href="https://ahjdzx.github.io/chuhe-hanjie/">
          <span class="seal">帥</span>
          <h2>楚河汉界<small>象棋</small></h2>
          <p>马走日、象走田、炮要隔山打。小军队在棋盘上自己下象棋，你也可以接管一方，来一盘真棋！</p>
          <span class="go">去下棋</span>
        </a>
      </div>

      <footer>适合一年级小朋友 · 打开就能玩，不用安装任何东西</footer>
    </main>
  </body>
</html>
